name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Nastavení Java 17 (pro Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalace závislostí a příprava Capacitor Android projektu
        run: |
          npm install
          npm run prepare-www
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
          node scripts/patch-android.js

      - name: Sestavení a podepsání APK
        run: |
          cd android
          chmod +x gradlew
          keytool -genkeypair -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mytube -storepass mytube123 -keypass mytube123 -dname "CN=MyTube Feed, O=MyTube, C=CZ"
          ./gradlew assembleRelease             -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks             -Pandroid.injected.signing.store.password="mytube123"             -Pandroid.injected.signing.key.alias="mytube"             -Pandroid.injected.signing.key.password="mytube123"
          cp app/build/outputs/apk/release/app-release.apk ../MyTube-Feed.apk

      - name: Uložení APK jako artefaktu v GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-Feed-APK
          path: MyTube-Feed.apk

      - name: Připojení APK k GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.9.4' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Verze 0.9.4' }}
          files: MyTube-Feed.apk

      - name: Publikování na Zapstore
        if: env.SIGN_WITH != ''
        env:
          SIGN_WITH: ${{ secrets.SIGN_WITH }}
        run: |
          ZSP_URL=$(curl -s https://api.github.com/repos/zapstore/zsp/releases/latest | grep -o 'https://[^"]*linux-amd64[^"]*' | head -n 1)
          curl -L "$ZSP_URL" -o zsp_archive
          if echo "$ZSP_URL" | grep -q "\.tar\.gz$"; then
            tar -xzf zsp_archive
          elif echo "$ZSP_URL" | grep -q "\.zip$"; then
            unzip -o zsp_archive
          else
            mv zsp_archive zsp
          fi
          chmod +x zsp
          ./zsp publish --yes || ./zsp publish
